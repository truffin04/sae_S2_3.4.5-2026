{% extends "client/layout_client.html" %}
{% block body %}
<div class="container" style="max-width:600px;">

    <h2 class="mt-3 mb-3">Ajouter une adresse</h2>

    <div class="card">
        <div class="card-body">
            <p class="text-muted">
                Utilisateur connecté : <strong>{{ utilisateur.nom }}</strong>
                (login : {{ utilisateur.login }})
            </p>

            <form action="/client/coordonnee/add_adresse" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold" for="nom">Nom / prénom (pour la livraison et facturation) :</label>
                    <input type="text" id="nom" name="nom" required maxlength="50"
                           class="form-control" value="{{ nom }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="rue">Numéro et nom de rue :</label>
                    <input type="text" id="rue" name="rue" required
                           class="form-control" value="{{ rue }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="code_postal">Code postal (5 chiffres) :</label>
                    <input type="text" id="code_postal" name="code_postal" required
                           maxlength="5" class="form-control" value="{{ code_postal }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="ville">Ville :</label>
                    <input type="text" id="ville" name="ville" required maxlength="50"
                           class="form-control" value="{{ ville }}">
                </div>
                <button class="btn btn-success" type="submit">Valider</button>
                <a href="/client/coordonnee/show" class="btn btn-secondary ms-2">Annuler</a>
            </form>
        </div>
    </div>

</div>
{% endblock %}
